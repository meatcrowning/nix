<title>Xanadu ~/nix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --void: #060a13;
    --void-2: #0d1526;
    --ink: #d6deea;
    --ink-dim: #7d8aa3;
    --line: #1c2740;
    --panel: rgba(9, 14, 26, 0.86);
    --path: #f5a524;
    --option: #5fe3b0;
    --unit: #8ea2ff;
    --file: #ff6fae;
    --overlay: #c38bff;
    --top: #4fb3ff;
    --air: #ffcf5c;
    --ui: "Chivo", "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "DejaVu Sans Mono", monospace;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, var(--void-2), var(--void) 70%);
    color: var(--ink); font: 13px/1.45 var(--ui);
  }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  .hud {
    position: fixed; left: 16px; top: calc(16px + env(safe-area-inset-top, 0px));
    width: min(300px, calc(100vw - 32px));
    display: grid; gap: 12px; padding: 14px 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    backdrop-filter: blur(6px); transition: opacity 0.3s;
  }
  body.reading .hud { opacity: 0.18; }
  body.reading .hud:hover, body.reading .hud:focus-within { opacity: 1; }
  .hud h1 { margin: 0; font: 800 20px/1.1 var(--ui); letter-spacing: 0.01em; flex: 1; }
  .hud .top { display: flex; align-items: center; gap: 8px; }
  .hud .top button { padding: 3px 8px; font-weight: 400; color: var(--ink-dim); }
  body.menu-off .hud { display: none; }
  #menu-on {
    position: fixed; left: 16px; top: calc(16px + env(safe-area-inset-top, 0px));
    background: var(--panel); backdrop-filter: blur(6px);
  }
  body:not(.menu-off) #menu-on { display: none; }
  .hud h1 span { font: 400 13px var(--mono); color: var(--ink-dim); margin-left: 6px; }
  .hud .meta { color: var(--ink-dim); font: 12px var(--mono); font-variant-numeric: tabular-nums; }
  .kinds { display: grid; gap: 4px; }
  .kind {
    display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center;
    padding: 3px 6px; margin: 0 -6px; border-radius: 4px; cursor: pointer; user-select: none;
  }
  .kind:hover { background: rgba(255, 255, 255, 0.05); }
  .kind input { position: absolute; opacity: 0; pointer-events: none; }
  .kind .sw { width: 14px; height: 6px; border-radius: 2px; background: var(--c); box-shadow: 0 0 8px var(--c); }
  .kind:has(input:not(:checked)) { opacity: 0.4; }
  .kind:has(input:not(:checked)) .sw { box-shadow: none; }
  .kind:has(input:focus-visible) { outline: 1px solid var(--ink-dim); }
  .kind b { font-weight: 600; }
  .kind small { color: var(--ink-dim); font: 11px var(--mono); font-variant-numeric: tabular-nums; }
  .hosts { display: flex; gap: 14px; color: var(--ink-dim); font-size: 12px; }
  .hosts i { display: inline-block; width: 4px; height: 12px; vertical-align: -2px; margin-right: 6px; background: var(--c); }
  .find { display: flex; gap: 6px; }
  .find input {
    flex: 1; min-width: 0; padding: 6px 8px; border-radius: 4px;
    border: 1px solid var(--line); background: rgba(0, 0, 0, 0.35); color: var(--ink);
    font: 12px var(--mono);
  }
  .find input:focus { outline: none; border-color: var(--ink-dim); }
  button {
    font: 600 12px var(--ui); color: var(--ink); background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; cursor: pointer;
  }
  button:hover { background: rgba(255, 255, 255, 0.12); }
  button:focus-visible { outline: 1px solid var(--ink-dim); }
  .help { color: var(--ink-dim); font-size: 11.5px; line-height: 1.5; }
  .help kbd, #cap kbd { font: 11px var(--mono); color: var(--ink); }

  #tip {
    position: fixed; pointer-events: none; padding: 3px 7px; border-radius: 3px;
    background: rgba(4, 7, 14, 0.92); border: 1px solid var(--line);
    font: 11.5px var(--mono); color: var(--ink); white-space: nowrap; transform: translate(12px, 12px);
  }
  #cap {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    max-width: calc(100vw - 32px); box-sizing: border-box;
    display: flex; flex-wrap: wrap; gap: 4px 16px; justify-content: center; align-items: baseline;
    padding: 7px 14px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line);
    font: 12px var(--ui); color: var(--ink-dim);
  }
  #cap b { font: 600 12.5px var(--mono); color: var(--ink); }
  #cap .n { font: 12px var(--mono); font-variant-numeric: tabular-nums; }

  @media (max-width: 760px) {
    .hud { gap: 8px; padding: 10px 12px; }
    .hud .help { display: none; }
    body.reading .hud { display: none; }
    #cap .keys { display: none; }
  }
</style>

<div id="stage"></div>

<section class="hud" aria-label="Controls">
  <div class="top"><h1>Xanadu <span>~/nix</span></h1><button type="button" id="menu-off" title="Hide menu (M)">Hide</button></div>
  <div class="meta" id="meta"></div>
  <div class="kinds" id="kinds"></div>
  <div class="hosts">
    <span><i style="--c: var(--top)"></i>top guard</span>
    <span><i style="--c: var(--air)"></i>air / aarch64 guard</span>
  </div>
  <form class="find" id="find">
    <input id="q" list="paths" placeholder="jump to file…" autocomplete="off" aria-label="Jump to file">
    <datalist id="paths"></datalist>
    <button type="button" id="home">Overview</button>
  </form>
  <div class="help"><kbd>WASD</kbd> fly · <kbd>Q</kbd>/<kbd>E</kbd> down/up · <kbd>Shift</kbd> faster · drag to look · right-drag to slide · scroll to glide · move close to a page to read it · click a page to pull it forward with everything bridged to it · <kbd>/</kbd> find · <kbd>M</kbd> menu</div>
</section>

<button type="button" id="menu-on" title="Show menu (M)">Menu</button>
<div id="cap" hidden></div>
<div id="tip" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
const DATA = /*XANADU_DATA*/null;

const KINDS = {
  path:    { name: "path",    what: "names another file",       css: "--path" },
  option:  { name: "option",  what: "declares ↔ reads option",  css: "--option" },
  unit:    { name: "unit",    what: "systemd unit it defines",  css: "--unit" },
  file:    { name: "file",    what: "file it deploys",          css: "--file" },
  overlay: { name: "overlay", what: "package it overrides",     css: "--overlay" },
};
const css = getComputedStyle(document.documentElement);
for (const k in KINDS) KINDS[k].color = css.getPropertyValue(KINDS[k].css).trim();
const HOSTC = { top: css.getPropertyValue("--top").trim(), air: css.getPropertyValue("--air").trim() };
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---- field geometry (world units) ----
const W = 4, GAP = 1.5, LH = 0.055, PER_ROW = 16, ROW_DZ = 16, ROW_DY = 4.5;
const GROUP_ORDER = ["/", "hosts/", "sys/", "lib/", "overlays/", "home/", "home/prog/", "home/srvs/", "home/pkgs/", "apps/"];
// ---- reading geometry: pages pulled forward sit D in front of the camera ----
const D = 10, RL = 0.02;          // RL: line height as a fraction of page width (100 columns)
const HEAD = 2;                   // header rows on a pulled-forward page
const SIDE_LINES = 14, SIDE_MAX = 16, CHUNK = 240, TILT = 0.34, RLP = 22;

const pages = DATA.pages.map((p, i) => ({ ...p, i, lines: p.text.split("\n"), out: [], inc: [] }));
const links = DATA.links;
links.forEach((l, i) => { l.i = i; pages[l.a].out.push(l); pages[l.b].inc.push(l); });
const on = Object.fromEntries(Object.keys(KINDS).map(k => [k, true]));

// ---- field layout: groups become rows receding in depth, stepping up like tiers ----
const groups = [...new Set(pages.map(p => p.group))]
  .sort((a, b) => (GROUP_ORDER.indexOf(a) + 1 || 99) - (GROUP_ORDER.indexOf(b) + 1 || 99));
const rows = [];
for (const g of groups) {
  const ps = pages.filter(p => p.group === g);
  for (let s = 0; s < ps.length; s += PER_ROW) rows.push({ group: g, first: s === 0, pages: ps.slice(s, s + PER_ROW) });
}
rows.forEach((row, r) => {
  const n = row.pages.length;
  row.y = r * ROW_DY; row.z = -r * ROW_DZ;
  row.pages.forEach((p, j) => {
    p.x = (j - (n - 1) / 2) * (W + GAP);
    p.y0 = row.y; p.z = row.z;
    p.h = Math.max(p.lines.length, 3) * LH;
  });
  row.x0 = row.pages[0].x - W / 2;
});
const yOf = (p, line) => p.y0 - (Math.min(line, p.lines.length) - 0.5) * LH;

// ---- renderer ----
const stage = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x060a13, 0.0065);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 2000);
// Fly camera: WASD move, Q/E down/up, Shift faster, drag to look, right-drag to slide.
camera.rotation.order = "YXZ";
const fly = { yaw: 0, pitch: 0, vel: new THREE.Vector3(), keys: new Set() };
const FLY_KEYS = new Set(["KeyW", "KeyA", "KeyS", "KeyD", "KeyQ", "KeyE", "Space", "KeyC", "ShiftLeft", "ShiftRight"]);
function lookAt(target, from = camera.position) {
  const d = target.clone().sub(from).normalize();
  return { yaw: Math.atan2(-d.x, -d.z), pitch: Math.asin(Math.max(-1, Math.min(1, d.y))) };
}
function applyLook() { camera.rotation.set(fly.pitch, fly.yaw, 0); }
function stepFly(dt) {
  const k = fly.keys, want = new THREE.Vector3(
    (k.has("KeyD") ? 1 : 0) - (k.has("KeyA") ? 1 : 0),
    (k.has("KeyE") || k.has("Space") ? 1 : 0) - (k.has("KeyQ") || k.has("KeyC") ? 1 : 0),
    (k.has("KeyS") ? 1 : 0) - (k.has("KeyW") ? 1 : 0));
  if (want.lengthSq()) {
    tween = null;
    const fast = k.has("ShiftLeft") || k.has("ShiftRight");
    want.normalize().multiplyScalar(fast ? 70 : 18);
    const up = want.y; want.y = 0;
    want.applyQuaternion(camera.quaternion); want.y += up;   // WASD follow the gaze, Q/E stay vertical
  }
  fly.vel.lerp(want, 1 - Math.exp(-dt * (want.lengthSq() ? 8 : 5)));
  if (fly.vel.lengthSq() < 1e-6) fly.vel.set(0, 0, 0);
  camera.position.addScaledVector(fly.vel, dt);
}
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();
const MAX_TEX = Math.min(renderer.capabilities.maxTextureSize, 8192);

// ---- text painting ----
const isMd = p => p.path.endsWith(".md");
function tokenize(line, md) {
  if (md) return /^\s*#/.test(line) ? [[line, "h"]] : /^\s*(~~~|```)/.test(line) ? [[line, "c"]] : [[line, ""]];
  const out = []; let i = 0, buf = "";
  const push = (t, c) => { if (buf) { out.push([buf, ""]); buf = ""; } if (t) out.push([t, c]); };
  const km = line.match(/^(\s*)([A-Za-z_][\w.'"-]*)(\s*=)(?!=)/);
  if (km) { out.push([km[1], ""], [km[2], "k"]); buf = km[3]; i = km[0].length; }
  while (i < line.length) {
    const ch = line[i];
    if (ch === "#") { push(line.slice(i), "c"); return out; }
    if (ch === '"') {
      let j = i + 1; while (j < line.length && line[j] !== '"') j += line[j] === "\\" ? 2 : 1;
      push(line.slice(i, j + 1), "s"); i = j + 1; continue;
    }
    if (ch === "'" && line[i + 1] === "'") { push("''", "s"); i += 2; continue; }
    buf += ch; i++;
  }
  push("", ""); return out;
}
const TK = { "": "#b9c5d8", c: "#6b8a77", s: "#e2a56a", k: "#8fb0ff", h: "#f0f4fa" };

function lineMarks(p) {
  const m = new Map();
  for (const l of p.out) if (on[l.k]) m.set(l.al, l.k);
  for (const l of p.inc) if (on[l.k] && l.bl > 1) m.set(l.bl, l.k);
  return m;
}

// Paints lines [start, start+count) of a page; `head` rows of title strip on top.
// `real` draws glyphs; otherwise words are greeked into bars for the distant field.
function paintPage(p, { lp, width, real, start = 0, count = p.lines.length, head = 0 }) {
  const rowsN = Math.max(count, 1) + head;
  const cv = document.createElement("canvas"); cv.width = width; cv.height = Math.round(rowsN * lp);
  const g = cv.getContext("2d");
  g.fillStyle = "#101828"; g.fillRect(0, 0, cv.width, cv.height);
  const y0 = head * lp, inRange = ln => ln > start && ln <= start + count;
  for (const [ln, k] of lineMarks(p)) if (inRange(ln)) {
    g.globalAlpha = 0.26; g.fillStyle = KINDS[k].color; g.fillRect(0, y0 + (ln - 1 - start) * lp, cv.width, lp);
  }
  g.globalAlpha = 1;
  for (const [ln, host] of p.hosts) if (inRange(ln)) {
    g.fillStyle = HOSTC[host]; g.fillRect(0, y0 + (ln - 1 - start) * lp, Math.max(3, lp * 0.3), lp);
  }
  const pad = Math.max(4, lp * 0.9), cols = 100, cw = (cv.width - pad * 1.5) / cols;
  if (head) {
    g.fillStyle = "#1c2840"; g.fillRect(0, 0, cv.width, y0);
    g.textBaseline = "middle";
    g.font = `600 ${lp * 0.95}px "JetBrains Mono", monospace`; g.fillStyle = "#e8eef8";
    g.fillText(p.path, pad, y0 / 2);
    const sub = count >= p.lines.length ? `${p.lines.length} lines` : `${start + 1}–${start + count} of ${p.lines.length}`;
    g.font = `400 ${lp * 0.7}px "JetBrains Mono", monospace`; g.fillStyle = "#7d8aa3";
    g.textAlign = "right"; g.fillText(sub, cv.width - pad, y0 / 2); g.textAlign = "left";
  }
  if (real) {
    g.font = `${Math.min(lp * 0.8, cw / 0.6)}px "JetBrains Mono", monospace`; g.textBaseline = "middle";
  }
  const md = isMd(p);
  for (let li = start; li < Math.min(start + count, p.lines.length); li++) {
    let col = 0; const yc = y0 + (li - start) * lp + lp / 2;
    for (const [t, c] of tokenize(p.lines[li], md)) {
      g.fillStyle = TK[c];
      if (real) g.fillText(t, pad + col * cw, yc);
      else for (const m of t.matchAll(/\S+/g)) g.fillRect(pad + (col + m.index) * cw, yc - lp * 0.26, m[0].length * cw, lp * 0.52);
      col += t.length; if (col > cols) break;
    }
  }
  // a dark page on a dark void needs its own edge
  g.strokeStyle = "#3b4d70"; g.lineWidth = Math.max(2, lp * 0.15);
  g.strokeRect(g.lineWidth / 2, g.lineWidth / 2, cv.width - g.lineWidth, cv.height - g.lineWidth);
  const tex = new THREE.CanvasTexture(cv);
  tex.encoding = THREE.sRGBEncoding; tex.anisotropy = MAX_ANISO;
  return tex;
}
function lowTex(p) {
  const lp = Math.min(4, MAX_TEX / Math.max(p.lines.length, 3));
  return paintPage(p, { lp, width: Math.round((W / LH) * lp), real: false });
}

function labelTexture(text, sub, w, h, big) {
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const g = cv.getContext("2d");
  g.textBaseline = "middle";
  if (big) {
    g.font = `800 ${h * 0.62}px Chivo, sans-serif`; g.fillStyle = "#e8eef8"; g.fillText(text, 4, h / 2);
  } else {
    g.font = `600 ${h * 0.5}px "JetBrains Mono", monospace`; g.fillStyle = "#e8eef8";
    g.fillText(text, 2, h * 0.36);
    g.font = `400 ${h * 0.3}px "JetBrains Mono", monospace`; g.fillStyle = "#7d8aa3";
    g.fillText(sub, 2, h * 0.8);
  }
  const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding; t.anisotropy = MAX_ANISO;
  return t;
}

// Pages near the camera swap their greeked texture for real text; LOD_MAX caps
// the live ones and LOD_PER_TICK spreads the painting so flying never hitches.
const LOD_ON = 4, LOD_OFF = 2.5, LOD_MAX = 16, LOD_PER_TICK = 2;
function fieldHiTex(p) {
  const lp = Math.max(4, Math.min(14, Math.floor(MAX_TEX / Math.max(p.lines.length, 3))));
  return paintPage(p, { lp, width: Math.round((W / LH) * lp), real: true });
}
const frustum = new THREE.Frustum(), projM = new THREE.Matrix4();
let lodClock = 0;
function stepLOD(now) {
  if (now - lodClock < 120) return;
  lodClock = now;
  projM.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  frustum.setFromProjectionMatrix(projM);
  const k = innerHeight / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  const c = camera.position, ranked = [];
  for (const p of pages) {
    let px = 0;
    if (p.mesh.visible && frustum.intersectsObject(p.mesh)) {
      const dx = c.x - Math.max(p.x - W / 2, Math.min(p.x + W / 2, c.x));
      const dy = c.y - Math.max(p.y0 - p.h, Math.min(p.y0, c.y));
      const dist = Math.max(0.1, Math.hypot(dx, dy, c.z - p.z));
      px = LH * k / dist;                       // on-screen height of one line
    }
    p.linePx = px;
    if (px >= (p.fhi ? LOD_OFF : LOD_ON)) ranked.push(p);
  }
  ranked.sort((a, b) => b.linePx - a.linePx);
  const keep = new Set(ranked.slice(0, LOD_MAX));
  let painted = 0;
  for (const p of pages) {
    if (p.fhi && !keep.has(p)) {
      p.fhi.dispose(); p.fhi = null; p.mesh.material.map = p.low; p.mesh.material.needsUpdate = true;
    }
  }
  for (const p of ranked) {
    if (!keep.has(p) || p.fhi) continue;
    if (painted++ >= LOD_PER_TICK) break;
    p.fhi = fieldHiTex(p); p.mesh.material.map = p.fhi; p.mesh.material.needsUpdate = true;
  }
}

// ---- the field ----
const pageMeshes = [];
function buildPages() {
  for (const p of pages) {
    p.low = lowTex(p);
    const mat = new THREE.MeshBasicMaterial({ map: p.low, transparent: true, opacity: 0.9, side: THREE.DoubleSide, depthWrite: false });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(W, p.h), mat);
    mesh.position.set(p.x, p.y0 - p.h / 2, p.z); mesh.userData.page = p; mesh.renderOrder = 1;
    p.mesh = mesh; scene.add(mesh); pageMeshes.push(mesh);
    mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry),
      new THREE.LineBasicMaterial({ color: 0x6f86b0, transparent: true, opacity: 0.55 })));
    const base = p.path.split("/").pop(), dir = p.path.slice(0, -base.length) || "./";
    p.label = new THREE.Mesh(new THREE.PlaneGeometry(W, W / 8),
      new THREE.MeshBasicMaterial({ map: labelTexture(base, dir + " · " + p.lines.length + " lines", 512, 64), transparent: true, depthWrite: false }));
    p.label.position.set(p.x, p.y0 + W / 16 + 0.08, p.z); scene.add(p.label);
  }
  for (const row of rows) if (row.first) {
    const lab = new THREE.Mesh(new THREE.PlaneGeometry(W * 3, W * 3 / 8),
      new THREE.MeshBasicMaterial({ map: labelTexture(row.group === "/" ? "flake root" : row.group, "", 1024, 128, true), transparent: true, depthWrite: false }));
    lab.position.set(row.x0 + W * 1.5, row.y + 1.4, row.z); scene.add(lab);
  }
}

// ---- bridges: translucent ribbons from span to span ----
const bridgeMat = () => new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
// segs: [{p0, p3, t0, t3, kind, dir}] — dir is the horizontal tangent sign at each end
function ribbons(segs, gain) {
  const pos = [], col = [], idx = [], SEG = 28, c = new THREE.Color();
  for (const s of segs) {
    const d = Math.max(s.minBend || 1.6, s.p0.distanceTo(s.p3) * (s.bend || 0.28));
    const curve = new THREE.CubicBezierCurve3(s.p0,
      s.p0.clone().add(new THREE.Vector3(s.d0 * d, 0, 0)),
      s.p3.clone().add(new THREE.Vector3(s.d3 * d, 0, 0)), s.p3);
    c.set(KINDS[s.kind].color);
    const base = pos.length / 3;
    for (let k = 0; k <= SEG; k++) {
      const u = k / SEG, pt = curve.getPoint(u), t = s.t0 + (s.t3 - s.t0) * u;
      pos.push(pt.x, pt.y + t / 2, pt.z, pt.x, pt.y - t / 2, pt.z);
      const f = gain * (0.35 + 0.65 * Math.pow(Math.abs(2 * u - 1), 2));
      col.push(c.r * f, c.g * f, c.b * f, c.r * f, c.g * f, c.b * f);
      if (k < SEG) { const v = base + k * 2; idx.push(v, v + 1, v + 2, v + 1, v + 3, v + 2); }
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  geo.setIndex(idx);
  return geo;
}
let bridgeMesh = null;
function buildBridges() {
  if (bridgeMesh) { scene.remove(bridgeMesh); bridgeMesh.geometry.dispose(); }
  const segs = links.filter(l => on[l.k]).map(l => {

        ...h.p.out.filter(l => on[l.k] && l.al === h.line).map(l => pages[l.b].path),
        ...h.p.inc.filter(l => on[l.k] && l.bl === h.line && l.bl > 1).map(l => pages[l.a].path)])];
      if (!names.length) { tip.hidden = true; return; }
      tip.textContent = names.join("  ·  ");
    } else {
      const ln = h.p.lines[h.line - 1].trim();
      tip.textContent = `${h.p.path}:${h.line}  ${ln.length > 60 ? ln.slice(0, 60) + "…" : ln}`;
    }
    tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; tip.hidden = false;
  });
});
renderer.domElement.addEventListener("pointerleave", () => { tip.hidden = true; });
renderer.domElement.addEventListener("contextmenu", e => e.preventDefault());
renderer.domElement.addEventListener("wheel", e => {
  e.preventDefault();
  const m = e.deltaMode === 1 ? 20 : e.deltaMode === 2 ? innerHeight : 1;
  if (!R) {
    tween = null;
    const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    fly.vel.addScaledVector(fwd, -e.deltaY * m * 0.35);
    return;
  }
  if (R.leaving) return;
  let dy = e.deltaY * m, dx = e.deltaX * m;
  if (zHeld) { R.zoom = Math.max(0.5, Math.min(2.2, R.zoom * Math.exp(-dy * 0.002))); return; }
  if (e.shiftKey && !dx) { dx = dy; dy = 0; }
  if (dx) panBy(-dx / (innerHeight / view().Hv));
  if (!dy) return;
  R.scrollT = Math.max(0, Math.min(R.focus.lines.length - 3, R.scrollT + dy * 0.05));
}, { passive: false, capture: true });

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});

function frame(now) {
  if (tween) {
    const u = Math.min(1, (now - tween.t0) / tween.dur), e = ease(u);
    camera.position.lerpVectors(tween.fromP, tween.toP, e);
    fly.yaw = tween.yaw0 + tween.dyaw * e; fly.pitch = tween.pitch0 + (tween.pitch1 - tween.pitch0) * e;
    if (u >= 1) tween = null;
  }
  const dt = Math.min(0.05, (now - (frame.last || now)) / 1000); frame.last = now;
  if (!R) { stepFly(dt); applyLook(); stepLOD(now); }
  else stepReading(now);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// fonts must be ready before any canvas text is painted
Promise.race([
  Promise.all([document.fonts.load('600 32px "JetBrains Mono"'), document.fonts.load('400 12px "JetBrains Mono"'), document.fonts.load("800 64px Chivo")]),
  new Promise(r => setTimeout(r, 2500)),
]).catch(() => {}).then(() => {
  buildPages(); buildBridges();
  const [t, p] = overviewPose(); camera.position.copy(p); Object.assign(fly, lookAt(t)); applyLook();
  if (/^#[\w./-]+$/.test(location.hash)) {
    const p0 = pages.find(p => p.path === location.hash.slice(1)); if (p0) go(p0, 0);
  }
  requestAnimationFrame(frame);
});
</script>
