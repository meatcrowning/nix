font_family	MorePerfectDOSVGA	
bold_font	auto
italic_font	auto
bold_italic_font auto
font_size	11.0
cursor_shape    block
shell_integration no-cursor
cursor		red
cursor_blink_interval 0.5
cursor_trail 2
cursor_trail_decay 0.1 0.2

# Mouse pointer hiding: <hide-wait> <unhide-wait> <unhide-threshold> <scroll-unhide>
# Require sustained real motion before showing the pointer, so merely focusing
# the window (a single enter event) or clicking won't reveal the I-beam.
mouse_hide_wait 3.0 0.2 40 no

include theme.conf
# Pixel font from the Settings pick. Written by ~/.config/scripts/apply-pixel-font.sh
# (read from settings.json), which is itself called from wal-set.sh on login and
# from the panel when fontFamily/fontSize change. Keeping the defaults above as
# a fallback means kitty always has a valid font even before that script's first
# run. Include comes AFTER the font_family/font_size lines so the generated
# values win when present.
include font.conf
confirm_os_window_close 0

# Remote control over a per-process socket, so kitty-focus-dim.py (started from
# Hyprland autostart) can grey the foreground when the window is unfocused —
# kitty can't self-detect OS focus under Hyprland. socket-only = control only
# via this socket, never via terminal escape codes from the running program.
allow_remote_control socket-only
listen_on unix:/run/user/1000/kitty-{kitty_pid}

# Free split handles: dragging a border in the splits layout moves exactly
# that border, pinned 1:1 to the pointer, instead of proportionally sliding
# every border nested inside the grabbed tree node. The watcher file carries
# the how and the harness pointer. Loaded once per kitty PROCESS (at first
# window creation), so running kitties keep stock behaviour until restarted.
watcher free-handles.py

# Titlebar buttons: every kitty launch also starts the hyprvtb button client
# (background window in the session, no visible effect) which registers the
# split/copy/paste/tab buttons on the compositor titlebar's inner column and
# replays clicks via `kitten @` on the socket above. Explicit `kitty <cmd>`
# invocations skip the session, so the scratchpad etc. still work unchanged.
startup_session vtb.session
