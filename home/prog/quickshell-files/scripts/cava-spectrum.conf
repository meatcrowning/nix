# cava config for the media widget's spectrum analyser (quickshell/MediaPanel.qml):
# mono bars, raw ascii "b1;b2;...;bN;\n" frames on stdout, each 0-100.
# Same output plumbing as cava-vu.conf (VuMeter.qml), just more buckets and
# folded to mono so it reads as a spectrum of whatever's on the output sink.
# NOTE: `bars` below is the default/fallback — MediaPanel.qml patches it to the
# live `mediaSpectrumBars` setting in a runtime copy before launching cava.
#
# Responsiveness tuning (measured against 10s of live playback, 2026-07-25).
# Keep `autosens = 1` (cava's default). Turning it off is the obvious-looking
# fix and is WRONG: at sensitivity=100 with autosens off the bars flatline —
# per-bar medians measured 0..3 out of 100 — because cava reads the hardware
# sink's *post-volume* monitor (sink sits at ~55%), so the usable sensitivity
# depends on the volume knob and the track's mastering. That is exactly the
# "needs a per-song setting" trap. Autosens is the thing making it work at all;
# the sluggish feel came from the three settings below instead.
[general]
framerate = 60
bars = 16
# Default range is 50..10000 Hz, which parks the top buckets in a band that
# barely moves and wastes the bottom ones. Widening lifted the per-bar medians
# across the board (p90 43 -> 49) and gives the treble bars something to do.
lower_cutoff_freq = 30
higher_cutoff_freq = 16000

[input]
# Visualize the audio BEFORE the EasyEffects chain, not after it. Apps play
# into the `easyeffects_sink` null sink; EasyEffects reads *its* monitor,
# processes, and forwards to the hardware sink — so `easyeffects_sink.monitor`
# is the raw pre-processing signal, while the hardware sink's monitor (cava's
# `auto` default) is post-EQ/compression. Two things fall out of the switch:
# the chain's dynamics processing is no longer flattening the bars (measured
# mean frame-to-frame movement 3.51 -> 4.34), and the tap is pre-volume-fader,
# so the picture no longer rescales when the volume knob moves.
# `source` below is the fallback — MediaPanel.qml rewrites it to the
# EasyEffects monitor in the runtime copy when that sink actually exists, and
# leaves `auto` when it doesn't (EasyEffects not up yet / not installed), so a
# missing chain degrades to the hardware monitor instead of crash-looping.
method = pulse
source = auto

[output]
method = raw
data_format = ascii
ascii_max_range = 100
channels = mono

[smoothing]
# 0..100, higher = smoother/slower (cava's default is 77). 30 was still damping
# the attack hard: mean frame-to-frame movement was 1.58/100 units at 60fps,
# i.e. ~1px on a widget this size. At 10 it's 2.87 — transients actually land.
noise_reduction = 10
# Neighbour bars follow a peak instead of standing alone. Costs a little
# frequency precision, buys a lot of apparent liveliness (|delta| 2.87 -> 3.28)
# and stops single-bucket spikes from looking like noise.
monstercat = 1.5
