# cava config for the panel's stereo VU bars (quickshell/VuMeter.qml):
# 2 bars in stereo = one bucket per channel; raw ascii "L;R;\n" frames on
# stdout, 0-100.
#
# NOTE the deliberate difference from cava-spectrum.conf: NO [input] section
# here, so cava's `auto` default stands and this reads the *hardware sink's*
# monitor — the signal after the EasyEffects chain and after the volume fader,
# i.e. what is actually coming out of the speakers. That is the whole point of
# a VU meter, and it is why the spectrum's pre-chain tap was not copied over.
[general]
framerate = 60
bars = 2

[output]
method = raw
data_format = ascii
ascii_max_range = 100
channels = stereo

[smoothing]
# 0..100, higher = smoother/slower. Measured on live playback: 20 moved 2.45
# units per frame, 10 moves 3.06 (~25% livelier). Going lower does NOT keep
# helping — 5 measured 2.80, worse than 10, as the extra jitter starts fighting
# autosens' gain tracking. So 10 is the floor worth taking, not a step on the
# way to 0. No monstercat: with one bucket per channel there are no neighbouring
# bars for it to act on.
noise_reduction = 10
