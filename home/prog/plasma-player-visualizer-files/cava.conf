[general]
bars = 16
framerate = 120
autosens = 1
lower_cutoff_freq = 30
higher_cutoff_freq = 16000

[input]
method = pipewire
# cava-state.py replaces this only after EasyEffects' upstream sink exists.
source = auto

[smoothing]
noise_reduction = 0
monstercat = 1.5

[output]
method = raw
# One full-width spectrum: average the channels and order the fixed 16 bars
# from low to high instead of Cava's default mirrored stereo layout.
channels = mono
mono_option = average
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
