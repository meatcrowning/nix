# ly config override for book, selected by the systemd drop-in
# /etc/systemd/system/ly@tty2.service.d/10-supervised.conf (installed by
# tools/install-ly-supervision.sh), which starts ly with
# `--config /home/lam/.config/ly`.
#
# Every key NOT listed here takes ly's compiled defaults — which are exactly
# what Fedora's /etc/ly/config.ini leaves most of its keys at. The three
# restated lines are the ones Fedora actually customizes (session_log,
# setup_cmd, start_cmd), and waylandsessions is the one deliberate change:
# it names this machine's session dir, where hyprland.desktop's Exec is
# hypr-supervise instead of /usr/bin/start-hyprland.
session_log = .local/state/ly-session.log
setup_cmd = /bin/sh /etc/ly/setup.sh
start_cmd = /bin/sh /etc/ly/startup.sh
waylandsessions = /home/lam/.config/ly/wayland-sessions
