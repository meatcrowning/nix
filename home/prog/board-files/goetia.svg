<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" color="#ffffff">
  <!-- goetia app icon — the seal of Bael, first spirit of the Ars Goetia.
       Redrawn as clean geometry from the 1904 Mathers/Crowley plate:
       outer circle, three-headed bird (top + two side heads), body bands,
       stem and forked tail.

       ONE transparent, theme-tracking variant. No filled tile: the sigil
       sits on transparency so it reads on any surface (a light-theme tile
       used to render as an opaque black square, DESIGN.md §3.1). The strokes
       are `currentColor` so the sigil IS the live theme's foreground (body
       text = the accent, §3.1) rather than a baked hue — the window icon is
       tinted at runtime by substituting currentColor for the wal `text`
       colour and rendering through QSvgRenderer (apps/board/main.py
       _window_icon), and re-tinted on every theme change. The root `color`
       above is only the fallback for external consumers that render the file
       directly (the desktop entry / panel task cell), which resolve
       currentColor to it. IT IS WHITE ON PURPOSE: the panel tints through
       MultiEffect, whose colorization scales the tint by the SOURCE's own
       luminance, so only a white sigil comes out the exact theme colour
       (measured — a #cc4400 fallback landed at 36% of it). Uniform 44-unit
       stroke = the 2px edge weight scaled to icon size (DESIGN.md §4). -->
  <g fill="none" stroke="currentColor" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="256" cy="256" r="218"/>
    <circle cx="256" cy="112" r="36"/>
    <path d="M256 148 L256 225"/>
    <circle cx="168" cy="225" r="54"/>
    <circle cx="344" cy="225" r="54"/>
    <path d="M168 225 L344 225"/>
    <path d="M200 295 L312 295"/>
    <path d="M256 317 L256 352"/>
    <path d="M256 352 L212 404"/>
    <path d="M256 352 L300 404"/>
  </g>
  <g fill="currentColor">
    <circle cx="256" cy="112" r="13"/>
    <circle cx="168" cy="225" r="21"/>
    <circle cx="344" cy="225" r="21"/>
  </g>
</svg>
