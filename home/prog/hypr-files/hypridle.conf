# hypridle — idle management for Hyprland.
#
# Scope here is DISPLAY POWER and SUSPEND. Idle auto-locking is NOT here: it
# lives in the panel (quickshell/Lock.qml's IdleMonitor), because its timeout is
# a live setting ("auto-lock after", settings.json's `autoLockMin`) and hypridle
# has no config reload — driving it from here would mean rewriting this file and
# restarting the daemon on every drag of the slider. The panel re-arms on the
# binding instead, and `autoLockMin = 0` simply disables its monitor.
#
# The two are deliberately decoupled: turning auto-lock off means "don't lock",
# not "never blank my screen", so the display still sleeps on the fixed timeout
# below. At the default 5 minutes the old behaviour is unchanged — lock at 5m00,
# blank at 5m30.
#
# Video playback that grabs a Wayland idle-inhibitor (zwp_idle_inhibit_manager_v1
# — Firefox/Chromium do this while playing) pauses hypridle's idle timers via
# Hyprland's ext-idle-notify, so it won't blank mid-video. The panel's
# IdleMonitor sets respectInhibitors for the same reason.

general {
    # External lock requests still funnel through logind's Lock signal:
    # `loginctl lock-session` emits it, hypridle catches it and runs lock_cmd.
    # `activate` is idempotent (Lock.qml no-ops if already locked), so repeat
    # signals are harmless.
    lock_cmd         = qs ipc call lock activate

    # Lock before suspend — via the panel's `suspend` entry point rather than
    # `loginctl lock-session`, because that one obeys the "lock on suspend"
    # setting (`lockOnSuspend`) while `activate` is unconditional.
    before_sleep_cmd = qs ipc call lock suspend
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# 5m30s idle -> turn the display off; any input wakes it.
listener {
    timeout    = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
