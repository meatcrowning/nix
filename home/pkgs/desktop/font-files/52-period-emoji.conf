<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Retain the application's text face; use 2012 outline emoji before the
       weak generic fallbacks. Both Quantal and modern fontconfig read this.
       A strong family outranks every weak one, and generic names resolve
       through weak aliases, so a request that starts with a generic name is
       left alone or Symbola would replace monospace, sans-serif and serif. -->
  <match target="pattern">
    <test qual="first" name="family" compare="not_eq"><string>monospace</string></test>
    <test qual="first" name="family" compare="not_eq"><string>mono</string></test>
    <test qual="first" name="family" compare="not_eq"><string>sans-serif</string></test>
    <test qual="first" name="family" compare="not_eq"><string>sans</string></test>
    <test qual="first" name="family" compare="not_eq"><string>serif</string></test>
    <test qual="first" name="family" compare="not_eq"><string>system-ui</string></test>
    <test qual="first" name="family" compare="not_eq"><string>cursive</string></test>
    <test qual="first" name="family" compare="not_eq"><string>fantasy</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>Symbola</string>
    </edit>
  </match>
  <!-- Modern fontconfig otherwise scores color=true above the requested
       family for the generic emoji alias. Quantal has no color renderer. -->
  <match target="pattern">
    <test name="family"><string>emoji</string></test>
    <edit name="color" mode="assign"><bool>false</bool></edit>
  </match>
  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Symbola</family></prefer>
  </alias>
</fontconfig>
