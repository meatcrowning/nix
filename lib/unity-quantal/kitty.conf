# Unity 12.10's terminal as Ubuntu shipped it: GNOME Terminal 3.6 with theme
# colours (Ambiance's aubergine), the Tango palette, the system monospace font
# (Ubuntu Mono 13) and a blinking block cursor. Unity showed its menus in the
# top panel and used overlay scrollbars, so the window is just the terminal.
# Only the Unity session loads this file; kitty's own config stays untouched.

font_family      Ubuntu Mono
bold_font        Ubuntu Mono Bold
italic_font      Ubuntu Mono Italic
bold_italic_font Ubuntu Mono Bold Italic
font_size 13

background #300a24
foreground #ffffff
cursor #ffffff
cursor_text_color background
selection_foreground #300a24
selection_background #ffffff
url_color #ffffff
url_style single

# gnome-terminal.schemas palette (Tango), as the original renders it: black 0.
color0  #000000
color1  #cc0000
color2  #4e9a06
color3  #c4a000
color4  #3465a4
color5  #75507b
color6  #06989a
color7  #d3d7cf
color8  #555753
color9  #ef2929
color10 #8ae234
color11 #fce94f
color12 #729fcf
color13 #ad7fa8
color14 #34e2e2
color15 #eeeeec

# GTK's 1.2 s blink cycle, which VTE kept running; hollow when unfocused.
cursor_shape block
cursor_shape_unfocused hollow
cursor_blink_interval 0.6
cursor_stop_blinking_after 0
cursor_trail 0
# Keep the block at the prompt; kitty's shell integration would make it a beam.
shell_integration no-cursor

# VTE's 1 px inner border; 80x24, with spare pixels at the right and bottom.
window_padding_width 0.75
placement_strategy top-left
initial_window_width 80c
initial_window_height 24c
remember_window_size no
background_opacity 1

# Tabs appear only with a second tab, in Ambiance's dark chrome.
tab_bar_min_tabs 2
tab_bar_edge top
tab_bar_style separator
tab_separator ""
tab_title_template " {title} "
tab_bar_background #3c3b37
active_tab_background #3c3b37
active_tab_foreground #dfdbd2
active_tab_font_style bold
inactive_tab_background #2b2a27
inactive_tab_foreground #a8a49c
inactive_tab_font_style normal

mouse_hide_wait -1
confirm_os_window_close 0
scrollback_lines 10000
update_check_interval 0
allow_remote_control no
linux_display_server x11
